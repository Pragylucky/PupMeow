<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144" width="144" height="144" role="img" aria-label="Pupmeow logo: half dog, half cat"><title>Pupmeow logo: half dog, half cat</title><style>.a{transform-box:fill-box;transform-origin:center}@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes flop{0%,100%{transform:rotate(0)}50%{transform:rotate(-9deg)}}@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}@keyframes twitch{0%,80%,100%{transform:rotate(0)}84%{transform:rotate(10deg)}88%{transform:rotate(-4deg)}}@keyframes whisk{0%,100%{transform:translateX(0)}50%{transform:translateX(2px)}}@keyframes spark{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}.body{animation:bounce 2.4s ease-in-out infinite}.ear{transform-box:fill-box;transform-origin:85% 10%;animation:flop 2.4s ease-in-out infinite}.eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}.catTip{transform-box:fill-box;transform-origin:10% 90%;animation:twitch 3.2s infinite}.wh{animation:whisk 1.6s ease-in-out infinite}.sp{transform-box:fill-box;transform-origin:center;animation:spark 2.4s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g transform="translate(12 12)"><g class="body"><rect width="120" height="120" rx="30" fill="#0e7c72"/><g class="ear"><path d="M42 39 q-26 -6 -26 30 q1 15 12 13 q10 -18 14 -43 z" fill="#d99a0f"/></g><g class="catTip"><path d="M76 40 l15 -19 l6 29 z" fill="#7a5af5"/></g><path d="M60 34 A34 34 0 0 0 60 102 Z" fill="#f6b21b"/><path d="M60 34 A34 34 0 0 1 60 102 Z" fill="#7a5af5"/><g class="eye"><circle cx="47" cy="64" r="4.5" fill="#1a2233"/><circle cx="48.5" cy="62.5" r="1.4" fill="#fff"/></g><path d="M68 64 q5 -6 10 0" stroke="#fff" stroke-width="3.2" fill="none" stroke-linecap="round"/><path d="M53 76 h14 l-7 8 z" fill="#1a2233"/><path d="M60 84 v4 m0 0 q-5 5 -10 1 m10 -1 q5 5 10 1" stroke="#1a2233" stroke-width="2.6" fill="none" stroke-linecap="round"/><g class="wh"><path d="M78 80 h12 M78 86 h11" stroke="#ffffffaa" stroke-width="2" stroke-linecap="round"/></g></g></g><g class="sp"><path d="M128 14 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" fill="#f6b21b"/></g><g class="sp" style="animation-delay:1.2s"><path d="M8 116 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" fill="#7a5af5"/></g></svg>