<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Pupmeow README hero</title>
  <style>
    * { margin: 0; box-sizing: border-box; }
    body { width: 900px; height: 315px; overflow: hidden; background: #085a53; }
    svg { display: block; width: 900px; height: 315px; }
    @keyframes bob-dog { 0%, 100% { transform: translate(200px, 248px) scale(1.05); } 50% { transform: translate(200px, 236px) scale(1.05); } }
    @keyframes bob-cat { 0%, 100% { transform: translate(920px, 255px) scale(0.92); } 50% { transform: translate(920px, 243px) scale(0.92); } }
    @keyframes bob-mark { 0%, 100% { transform: translate(528px, 118px); } 50% { transform: translate(528px, 110px); } }
    @keyframes paw1 { 0%, 100% { transform: translate(120px, 90px) rotate(-18deg); } 50% { transform: translate(128px, 78px) rotate(-18deg); } }
    @keyframes paw2 { 0%, 100% { transform: translate(1040px, 320px) rotate(12deg); } 50% { transform: translate(1030px, 308px) rotate(12deg); } }
    @keyframes paw3 { 0%, 100% { transform: translate(980px, 70px) scale(0.85) rotate(8deg); } 50% { transform: translate(990px, 82px) scale(0.85) rotate(8deg); } }
    @keyframes sparkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
    .anim-dog { animation: bob-dog 3.4s ease-in-out infinite; transform-origin: 0 0; }
    .anim-cat { animation: bob-cat 3.8s ease-in-out infinite; transform-origin: 0 0; }
    .anim-mark { animation: bob-mark 2.8s ease-in-out infinite; transform-origin: 0 0; }
    .anim-paw1 { animation: paw1 5s ease-in-out infinite; transform-origin: 0 0; }
    .anim-paw2 { animation: paw2 4.2s ease-in-out infinite; transform-origin: 0 0; }
    .anim-paw3 { animation: paw3 6s ease-in-out infinite; transform-origin: 0 0; }
    .sparkle { animation: sparkle 2.4s ease-in-out infinite; }
    .sparkle.s2 { animation-duration: 3s; }
    .sparkle.s3 { animation-duration: 2.8s; }
    .paused * { animation-play-state: paused !important; }
  </style>
</head>
<body class="paused">
  <svg xmlns="http://www.w3.org/2000/svg" width="900" height="315" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMid slice" aria-hidden="true">

        <stop offset="100%" stop-color="#085a53"/>

      <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      </linearGradient>
      <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.12"/>
      </pattern>
    </defs>
    <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
    <rect width="1200" height="420" rx="28" fill="url(#dots)"/>
    <rect width="1200" height="200" rx="28" fill="url(#shine)"/>
    <g opacity="0.55">

          <ellipse cx="0" cy="8" rx="5" ry="4.2" fill="#fff1cc" opacity="0.85"/>
          <circle cx="-7" cy="-2" r="3.2" fill="#fff1cc" opacity="0.85"/>
          <circle cx="-2" cy="-6" r="3.4" fill="#fff1cc" opacity="0.85"/>

          <circle cx="-2" cy="-6" r="3.4" fill="#fff1cc" opacity="0.85"/>
          <circle cx="4" cy="-6" r="3.4" fill="#fff1cc" opacity="0.85"/>
          <circle cx="9" cy="-2" r="3.2" fill="#fff1cc" opacity="0.85"/>
        </g>
      </g>
      <g class="anim-paw3" data-dur="6">
        <g transform="translate(0 0)">

          <circle cx="-7" cy="-2" r="3.2" fill="#fff1cc" opacity="0.85"/>
          <circle cx="-2" cy="-6" r="3.4" fill="#fff1cc" opacity="0.85"/>

    </g>

    <g class="anim-mark" data-dur="2.8">

    <text x="600" y="295" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#ffffff" letter-spacing="-1">pupmeow</text>

  </svg>
  <script>
    /** Seek all CSS animations to phase 0–1 (for GIF export). */
    function setHeroFrame(phase) {
      document.querySelectorAll("[data-dur]").forEach((el) => {
        const dur = parseFloat(el.getAttribute("data-dur") || "3");
        el.style.animationDelay = `${-phase * dur}s`;
      });
      document.querySelectorAll(".sparkle").forEach((el, i) => {
        const dur = i === 1 ? 3 : i === 2 ? 2.8 : 2.4;
        el.style.animationDelay = `${-phase * dur}s`;
      });
    }
    window.setHeroFrame = setHeroFrame;
    setHeroFrame(0);
  </script>
</body>
</html>
